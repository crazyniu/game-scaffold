import org.apache.tools.ant.taskdefs.condition.Os

// Firebase 的两个 Gradle 插件（读 google-services.json、上传 Crashlytics 的符号），GAME_FIREBASE 为 true 时才套用。
// 写在这里而不是根工程：Gradle 的根工程是 Cocos 每次构建生成的 build/android/proj/build.gradle，改了也会被覆盖
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.6.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
    }
}

apply plugin: 'com.android.application'

// 带不带广告 SDK：tools/native/apply.mjs 按 game.json 的 ads.enabled 改写。
// 关掉时不依赖 AdMob / UMP，GameAds 用 ads/off 里的空实现
def GAME_ADS = true
// 带不带 Firebase（统计 + 崩溃报告）：tools/native/apply.mjs 按 game.json 的 firebase.enabled 和 firebase/google-services.json 改写。
// 关掉时不依赖 Firebase，GameFirebase 用 firebase/off 里的空实现
def GAME_FIREBASE = false
if (GAME_FIREBASE) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

RES_PATH = RES_PATH.replace("\\", "/")
COCOS_ENGINE_PATH = COCOS_ENGINE_PATH.replace("\\", "/")

buildDir = "${RES_PATH}/proj/build/${project.name ==~ /^[_a-zA-Z0-9-]+$/ ? project.name : 'CocosGame'}"
android {
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion PROP_BUILD_TOOLS_VERSION
    ndkVersion PROP_NDK_VERSION
    namespace APPLICATION_ID

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId APPLICATION_ID
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                targets "cocos"
                arguments "-DRES_DIR=${RES_PATH}", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
            }
            ndk { abiFilters PROP_APP_ABI.split(':') }
        }
    }

    sourceSets.main {
        java.srcDirs "../src", "src", GAME_ADS ? "ads/on" : "ads/off", GAME_FIREBASE ? "firebase/on" : "firebase/off"
        res.srcDirs "../res", 'res', "${RES_PATH}/proj/res"
        jniLibs.srcDirs "../libs", 'libs'
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "${RES_PATH}/data"
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging Boolean.parseBoolean(PROP_ENABLE_COMPRESS_SO)
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "../CMakeLists.txt"
            buildStagingDirectory "${RES_PATH}/proj/build"
        }
    }

    signingConfigs {

       release {
            if (project.hasProperty("RELEASE_STORE_FILE") && !RELEASE_STORE_FILE.isEmpty()) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            // 用带 optimize 的默认配置：proguard-android.txt 里有 -dontoptimize，R8 只缩不优化，Play 管理中心会提示「请使用 R8 优化」（docs/06 第 4 节）
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
                        
            externalNativeBuild {
                cmake {
                    // switch HIDE_SYMBOLS to OFF to skip compilation flag `-fvisibility=hidden`
                    arguments "-DHIDE_SYMBOLS=ON"
                }
            }

            if (GAME_FIREBASE) {
                // 引擎是 C++：打上架包时把带符号的 .so 传给 Crashlytics，崩溃堆栈才看得懂（package.sh 打完 AAB 跑上传）
                firebaseCrashlytics { nativeSymbolUploadEnabled true }
            }

            if (!Boolean.parseBoolean(PROP_IS_DEBUG)) {
                getIsDefault().set(true)
            }

        }

        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            // resValue  "string", "app_name", "${PROP_APP_NAME}-dbg"
            // applicationIdSuffix ".debug"
        }
    }
}

// Cocos 引擎库 libcocos 自带的 consumer 规则（Cocos 安装目录 libcocos2dx/proguard-rules.pro）整包保留
// com.google.**、com.android.**、androidx.** 等：AdMob、Firebase、Play 服务、androidx 全都原样留着，R8 对它们不缩不优化，
// Play 管理中心一直提示「请使用 R8 优化」（只改我们自己的 proguard-rules.pro 不够，fishsort 1.0.4(6) 量过 dex 大小没变）。
// Cocos 安装目录不归我们改，Android Gradle 插件 8 也没有按依赖过滤库规则的开关，
// 所以等 libcocos 导出完规则再把这几行删掉（各 SDK 自带规则；引擎 C++ 经 JNI 按名字找的类在 proguard-rules.pro 里单独保留）。
// ./package.sh 打 AAB 后会查合并后的配置里还有没有整包保留（docs/06）
def GAME_BROAD_KEEP = ~/(?m)^-keep public class (com\.google|com\.android|google\.billing|google\.play|androidx)\.\*\* \{ \*; \}[ \t]*$/
gradle.projectsEvaluated {
    def lib = rootProject.findProject(':libcocos')
    if (lib == null) return
    lib.tasks.matching { it.name ==~ /export\w*ConsumerProguardFiles/ }.configureEach { t ->
        t.doLast {
            t.outputs.files.asFileTree.each { f ->
                def text = f.text
                def stripped = text.replaceAll(GAME_BROAD_KEEP, '# （整包保留已由 app/build.gradle 删掉）')
                if (stripped != text) f.text = stripped
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "${COCOS_ENGINE_PATH}/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libservice')
    implementation project(':libcocos')
    // 广告：AdMob + 用户同意（UMP），ads/on/.../GameAds.java 用
    // 广告、统计 SDK 间接带进来的 androidx 版本太旧，Play 管理中心提示「SDK 版本已过时」，这里显式抬到新版（docs/06 第 4 节）。
    // activity 1.13 要求 compileSdk 36、Android Gradle 插件 8.9.1 以上（现在是 36、8.10.1）
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    if (GAME_ADS) {
        // 25.5.0：Unity 中介适配器 4.22.0.0 要求的版本
        implementation 'com.google.android.gms:play-services-ads:25.5.0'
        // AdMob 中介：Unity Ads 参与竞价（docs/06 第 4 节「广告中介」）。只要适配器，Game ID、广告位在 AdMob 后台配，不进代码
        implementation 'com.google.ads.mediation:unity:4.22.0.0'
        // 适配器的 pom 不带 Unity Ads SDK 本身，要自己声明，版本跟适配器前三位一致（不声明 R8 报 Missing class com.unity3d.ads.*）
        implementation 'com.unity3d.ads:unity-ads:4.22.0'
        implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    }
    // Firebase：统计（Analytics）+ 崩溃报告（Crashlytics，带 NDK：引擎的 C++ 崩溃也收），firebase/on/.../GameFirebase.java 用
    if (GAME_FIREBASE) {
        implementation platform('com.google.firebase:firebase-bom:35.2.0')
        implementation 'com.google.firebase:firebase-analytics'
        implementation 'com.google.firebase:firebase-crashlytics-ndk'
    }
    if (Boolean.parseBoolean(PROP_ENABLE_INPUTSDK)) {
        implementation 'com.google.android.libraries.play.games:inputmapping:1.1.0-beta'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.10"
    }
}
